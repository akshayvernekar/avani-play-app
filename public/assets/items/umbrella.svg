<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="umbCanopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#6D4C41"/>
    </linearGradient>
    <filter id="umbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5D4037" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#EFEBE9" opacity="0.9"/>
  <g filter="url(#umbShadow)" transform="translate(200, 200)">
    <!-- Wooden Pole / Handle -->
    <rect x="-6" y="-20" width="12" height="150" rx="6" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
    <!-- Curved Crook Handle at Bottom -->
    <path d="M 0 130 C 0 155 -30 155 -30 135" fill="none" stroke="#5D4037" stroke-width="10" stroke-linecap="round"/>
    <!-- Traditional Dome Canopy -->
    <g transform="translate(0, -25)">
      <!-- Dome Silhouette -->
      <path d="M -110 0 C -110 -95 110 -95 110 0 Q 75 10 55 0 Q 25 10 0 0 Q -25 10 -55 0 Q -75 10 -110 0 Z" fill="url(#umbCanopy)" stroke="#4E342E" stroke-width="5"/>
      <!-- Canopy Rib lines -->
      <path d="M 0 -90 Q 0 -45 0 0" stroke="#FFE082" stroke-width="3" fill="none"/>
      <path d="M 0 -90 Q 40 -50 55 0" stroke="#FFE082" stroke-width="3" fill="none"/>
      <path d="M 0 -90 Q -40 -50 -55 0" stroke="#FFE082" stroke-width="3" fill="none"/>
      <path d="M 0 -90 Q 80 -40 108 0" stroke="#FFE082" stroke-width="2.5" fill="none"/>
      <path d="M 0 -90 Q -80 -40 -108 0" stroke="#FFE082" stroke-width="2.5" fill="none"/>
      <!-- Top finial knob -->
      <circle cx="0" cy="-90" r="10" fill="#FFD54F" stroke="#E65100" stroke-width="3"/>
      <path d="M 0 -90 L 0 -105" stroke="#E65100" stroke-width="4" stroke-linecap="round"/>
      <!-- Scalloped frills -->
      <circle cx="-82" cy="5" r="4" fill="#FFCA28"/>
      <circle cx="-27" cy="5" r="4" fill="#FFCA28"/>
      <circle cx="27" cy="5" r="4" fill="#FFCA28"/>
      <circle cx="82" cy="5" r="4" fill="#FFCA28"/>
    </g>
  </g>
</svg>