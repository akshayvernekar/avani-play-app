<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ploughWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="50%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="shareGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="ploughShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5D4037" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#E8F5E9" opacity="0.9"/>
  <g filter="url(#ploughShadow)" transform="translate(200, 200)">
    <!-- Main Long Beam / Pole (Hala Shaft) -->
    <g transform="rotate(-30)">
      <rect x="-120" y="-10" width="240" height="20" rx="10" fill="url(#ploughWood)" stroke="#3E2723" stroke-width="4"/>
      <!-- Cross Bar / Yoke Handle -->
      <rect x="-115" y="-45" width="16" height="90" rx="8" fill="url(#ploughWood)" stroke="#3E2723" stroke-width="4"/>
      <!-- Lower Heavy Plough Body -->
      <g transform="translate(80, 0)">
        <path d="M -15 0 L 15 0 L 35 85 L -35 85 Z" fill="url(#ploughWood)" stroke="#3E2723" stroke-width="4"/>
        <!-- Golden Ploughshare (Sharp Point at bottom) -->
        <polygon points="-40,85 40,85 0,135" fill="url(#shareGold)" stroke="#E65100" stroke-width="4"/>
        <line x1="0" y1="85" x2="0" y2="130" stroke="#FFF" stroke-width="3"/>
      </g>
    </g>
    <!-- Stalk of golden wheat / paddy tied to beam -->
    <g transform="translate(-25, 40) rotate(45)">
      <line x1="0" y1="30" x2="0" y2="-40" stroke="#4CAF50" stroke-width="3"/>
      <ellipse cx="-8" cy="-30" rx="5" ry="10" fill="#FFD54F" stroke="#E65100" stroke-width="1.5"/>
      <ellipse cx="8" cy="-20" rx="5" ry="10" fill="#FFD54F" stroke="#E65100" stroke-width="1.5"/>
      <ellipse cx="-8" cy="-10" rx="5" ry="10" fill="#FFD54F" stroke="#E65100" stroke-width="1.5"/>
      <ellipse cx="0" cy="-45" rx="5" ry="10" fill="#FFD54F" stroke="#E65100" stroke-width="1.5"/>
    </g>
  </g>
</svg>