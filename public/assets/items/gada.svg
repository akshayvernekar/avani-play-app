<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="gadaHead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="45%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
    <filter id="gadaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#FFF8E1" opacity="0.9"/>
  <g filter="url(#gadaShadow)" transform="translate(200, 200) rotate(-25)">
    <!-- Long Shaft -->
    <rect x="-9" y="-60" width="18" height="210" rx="9" fill="#FFB300" stroke="#E65100" stroke-width="4"/>
    <!-- Shaft grip bands -->
    <line x1="-9" y1="20" x2="9" y2="20" stroke="#D84315" stroke-width="3"/>
    <line x1="-9" y1="50" x2="9" y2="50" stroke="#D84315" stroke-width="3"/>
    <line x1="-9" y1="80" x2="9" y2="80" stroke="#D84315" stroke-width="3"/>
    <line x1="-9" y1="110" x2="9" y2="110" stroke="#D84315" stroke-width="3"/>
    <!-- Pommel at bottom -->
    <circle cx="0" cy="150" r="16" fill="url(#gadaHead)" stroke="#E65100" stroke-width="4"/>
    <!-- Massive Fluted Gada Head -->
    <g transform="translate(0, -85)">
      <!-- Spherical bulb -->
      <circle cx="0" cy="0" r="62" fill="url(#gadaHead)" stroke="#E65100" stroke-width="5"/>
      <!-- Fluting ribs -->
      <ellipse cx="0" cy="0" rx="22" ry="62" fill="none" stroke="#FFA000" stroke-width="4"/>
      <ellipse cx="0" cy="0" rx="44" ry="62" fill="none" stroke="#FFA000" stroke-width="4"/>
      <line x1="0" y1="-62" x2="0" y2="62" stroke="#E65100" stroke-width="4"/>
      <!-- Crown Spire on top -->
      <path d="M -12 -62 L 12 -62 L 0 -88 Z" fill="#FFE082" stroke="#E65100" stroke-width="4"/>
      <circle cx="0" cy="-88" r="6" fill="#D84315"/>
    </g>
  </g>
</svg>