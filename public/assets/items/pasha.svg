<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pashaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="85%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <radialGradient id="pashaGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A80"/>
      <stop offset="50%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </radialGradient>
    <radialGradient id="pashaSapphire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </radialGradient>
    <filter id="pashaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#E65100" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="160" fill="#E1F5FE" opacity="0.9"/>

  <g filter="url(#pashaShadow)" transform="translate(200, 200)">
    <!-- Top Open Lasso Loop -->
    <!-- Outer thick cord -->
    <circle cx="0" cy="-65" r="76" fill="none" stroke="url(#pashaGold)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="0" cy="-65" r="76" fill="none" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="0" cy="-65" r="86" fill="none" stroke="#E65100" stroke-width="2.5"/>
    <circle cx="0" cy="-65" r="66" fill="none" stroke="#E65100" stroke-width="2.5"/>

    <!-- Braided texture dashes on top loop -->
    <circle cx="0" cy="-65" r="76" fill="none" stroke="#FFE082" stroke-width="14" stroke-dasharray="8 8" opacity="0.8"/>

    <!-- Lower coiled loops -->
    <path d="M -45 5 C -75 25 -65 65 -25 70 C 15 75 40 45 45 15" fill="none" stroke="url(#pashaGold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M -45 5 C -75 25 -65 65 -25 70 C 15 75 40 45 45 15" fill="none" stroke="#E65100" stroke-width="2"/>
    <path d="M 45 5 C 75 25 65 65 25 70 C -15 75 -40 45 -45 15" fill="none" stroke="url(#pashaGold)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 45 5 C 75 25 65 65 25 70 C -15 75 -40 45 -45 15" fill="none" stroke="#E65100" stroke-width="2"/>

    <!-- Central Ornate Clasp / Medallion -->
    <g transform="translate(0, 10)">
      <circle cx="0" cy="0" r="28" fill="url(#pashaGold)" stroke="#E65100" stroke-width="3"/>
      <!-- Filigree lobes -->
      <circle cx="-22" cy="0" r="10" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <circle cx="22" cy="0" r="10" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <circle cx="0" cy="-22" r="10" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <circle cx="0" cy="22" r="10" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <!-- Central radiant ruby gem -->
      <circle cx="0" cy="0" r="14" fill="url(#pashaGem)" stroke="#B71C1C" stroke-width="2"/>
      <circle cx="-3" cy="-4" r="3" fill="#FFFFFF" opacity="0.8"/>
      <!-- Small accent beads -->
      <circle cx="-22" cy="0" r="4" fill="url(#pashaSapphire)"/>
      <circle cx="22" cy="0" r="4" fill="url(#pashaSapphire)"/>
      <circle cx="0" cy="-22" r="4" fill="url(#pashaSapphire)"/>
      <circle cx="0" cy="22" r="4" fill="url(#pashaSapphire)"/>
    </g>

    <!-- Divine Handle / Finial at bottom -->
    <g transform="translate(0, 85)">
      <!-- Upper collar -->
      <rect x="-14" y="0" width="28" height="12" rx="4" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <!-- Fluted handle grip -->
      <path d="M -11 12 L -8 68 L 8 68 L 11 12 Z" fill="url(#pashaGold)" stroke="#E65100" stroke-width="3"/>
      <line x1="0" y1="14" x2="0" y2="66" stroke="#FFE082" stroke-width="3"/>
      <line x1="-5" y1="14" x2="-4" y2="66" stroke="#D84315" stroke-width="1.5"/>
      <line x1="5" y1="14" x2="4" y2="66" stroke="#D84315" stroke-width="1.5"/>
      <!-- Handle jewel -->
      <circle cx="0" cy="40" r="5" fill="url(#pashaGem)" stroke="#B71C1C" stroke-width="1.5"/>
      <!-- Bottom pommel knob -->
      <circle cx="0" cy="74" r="12" fill="url(#pashaGold)" stroke="#E65100" stroke-width="2.5"/>
      <circle cx="0" cy="74" r="5" fill="url(#pashaSapphire)"/>
    </g>

    <!-- Celestial sparkles -->
    <path d="M -90 -120 L -85 -115 L -90 -110 L -95 -115 Z" fill="#FFF59D"/>
    <path d="M 90 -120 L 95 -115 L 90 -110 L 85 -115 Z" fill="#FFF59D"/>
    <path d="M 105 -40 L 110 -35 L 105 -30 L 100 -35 Z" fill="#FFF59D"/>
  </g>
</svg>
