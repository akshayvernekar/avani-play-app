<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="potGold" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
    <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <filter id="potShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.3"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#FCE4EC" opacity="0.9"/>
  <g filter="url(#potShadow)" transform="translate(200, 205)">
    <!-- Base shadow -->
    <ellipse cx="0" cy="95" rx="75" ry="16" fill="#D81B60" opacity="0.15"/>
    <!-- Kalash / Pot Body -->
    <path d="M -50 0 C -95 30 -85 85 -45 95 L 45 95 C 85 85 95 30 50 0 Z" fill="url(#potGold)" stroke="#E65100" stroke-width="5"/>
    <!-- Decorative Neck -->
    <rect x="-42" y="-15" width="84" height="20" rx="8" fill="#FFA000" stroke="#E65100" stroke-width="4"/>
    <ellipse cx="0" cy="-15" rx="44" ry="12" fill="#FFD54F" stroke="#E65100" stroke-width="4"/>
    <!-- Pot Decorative Swastik / Flower -->
    <circle cx="0" cy="48" r="18" fill="#FFF9C4" stroke="#E65100" stroke-width="3"/>
    <circle cx="0" cy="48" r="8" fill="#D81B60"/>
    <!-- Overflowing Pile of Gold Coins -->
    <g transform="translate(0, -25)">
      <!-- Back coins -->
      <ellipse cx="-25" cy="-10" rx="20" ry="14" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <ellipse cx="25" cy="-10" rx="20" ry="14" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <ellipse cx="0" cy="-25" rx="22" ry="15" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <!-- Mid coins -->
      <ellipse cx="-40" cy="5" rx="22" ry="14" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <ellipse cx="40" cy="5" rx="22" ry="14" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <ellipse cx="-15" cy="-5" rx="22" ry="15" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <ellipse cx="15" cy="-5" rx="22" ry="15" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
      <!-- Foreground overflowing cascading coins -->
      <ellipse cx="0" cy="8" rx="24" ry="16" fill="url(#coinGrad)" stroke="#E65100" stroke-width="3"/>
      <!-- Falling shiny coins -->
      <g transform="translate(-65, 35) rotate(-20)">
        <ellipse cx="0" cy="0" rx="16" ry="12" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
        <text x="0" y="4" font-size="11" text-anchor="middle" font-weight="bold" fill="#B71C1C">₹</text>
      </g>
      <g transform="translate(65, 35) rotate(20)">
        <ellipse cx="0" cy="0" rx="16" ry="12" fill="url(#coinGrad)" stroke="#E65100" stroke-width="2.5"/>
        <text x="0" y="4" font-size="11" text-anchor="middle" font-weight="bold" fill="#B71C1C">₹</text>
      </g>
      <!-- Rupee symbol on top coin -->
      <text x="0" y="-21" font-size="13" text-anchor="middle" font-weight="bold" fill="#B71C1C">₹</text>
      <text x="0" y="13" font-size="14" text-anchor="middle" font-weight="bold" fill="#B71C1C">₹</text>
    </g>
    <!-- Sparkling stars -->
    <path d="M -50 -55 Q -50 -40 -35 -40 Q -50 -40 -50 -25 Q -50 -40 -65 -40 Q -50 -40 -50 -55 Z" fill="#FFF" stroke="#FFD54F" stroke-width="1.5"/>
    <path d="M 55 -50 Q 55 -38 67 -38 Q 55 -38 55 -26 Q 55 -38 43 -38 Q 55 -38 55 -50 Z" fill="#FFF" stroke="#FFD54F" stroke-width="1.5"/>
  </g>
</svg>