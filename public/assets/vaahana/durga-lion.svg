<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dlSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="lMane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="lBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="dlShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#BF360C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="220" r="190" fill="#FFF8E1" opacity="0.7"/>

  <g filter="url(#dlShadow)">
    <!-- Friendly Lion Mount Base -->
    <g transform="translate(150, 300)">
      <!-- Mane -->
      <path d="M -80 -40 Q -40 -70 0 -80 Q 40 -70 80 -40 Q 90 20 60 70 Q 0 90 -60 70 Z" fill="url(#lMane)" stroke="#BF360C" stroke-width="5"/>
      <!-- Body -->
      <ellipse cx="50" cy="30" rx="115" ry="60" fill="url(#lBody)" stroke="#E65100" stroke-width="5"/>
      <!-- Lion Head -->
      <circle cx="-40" cy="0" r="48" fill="url(#lBody)" stroke="#E65100" stroke-width="5"/>
      <!-- Lion Muzzle -->
      <ellipse cx="-40" cy="18" rx="22" ry="16" fill="#FFF8E1"/>
      <path d="M -48 10 L -32 10 L -40 22 Z" fill="#4E342E"/>
      <!-- Lion Eyes -->
      <circle cx="-58" cy="-10" r="7" fill="#212121"/>
      <circle cx="-60" cy="-12" r="2.5" fill="#FFF"/>
      <circle cx="-22" cy="-10" r="7" fill="#212121"/>
      <circle cx="-20" cy="-12" r="2.5" fill="#FFF"/>
      <!-- Lion Ears -->
      <circle cx="-75" cy="-35" r="15" fill="#FFB300" stroke="#E65100" stroke-width="3"/>
      <!-- Lion Tail -->
      <path d="M 160 20 C 200 0 190 -40 210 -30" fill="none" stroke="#FFB300" stroke-width="8" stroke-linecap="round"/>
      <circle cx="210" cy="-30" r="10" fill="url(#lMane)"/>
    </g>

    <!-- Durga sitting gracefully on Lion -->
    <g transform="translate(250, 190)">
      <!-- Body / Red Sari -->
      <ellipse cx="0" cy="70" rx="68" ry="55" fill="url(#dlSkin)" stroke="#E65100" stroke-width="4"/>
      <path d="M -60 45 Q 0 120 60 45 Z" fill="#FF1744" stroke="#B71C1C" stroke-width="4"/>

      <!-- Head -->
      <circle cx="0" cy="-25" r="68" fill="url(#dlSkin)" stroke="#E65100" stroke-width="5"/>

      <!-- Crown -->
      <path d="M -60 -80 L 60 -80 L 45 -155 L 0 -180 L -45 -155 Z" fill="#FFD54F" stroke="#E65100" stroke-width="5"/>
      <circle cx="0" cy="-130" r="14" fill="#D50000"/>
      <circle cx="0" cy="-130" r="6" fill="#FFF"/>

      <!-- Eyes -->
      <ellipse cx="-28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="-31" cy="-42" r="4" fill="#FFF"/>
      <ellipse cx="28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="25" cy="-42" r="4" fill="#FFF"/>

      <!-- Bindi -->
      <circle cx="0" cy="-68" r="8" fill="#D50000"/>

      <!-- Smile -->
      <path d="M -18 -8 Q 0 12 18 -8" fill="none" stroke="#B71C1C" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cheeks -->
      <circle cx="-40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
      <circle cx="40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
    </g>
  </g>
</svg>
