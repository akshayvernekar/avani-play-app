<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="aCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="aRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <filter id="aShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#BF360C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fiery Halo Aura -->
  <circle cx="250" cy="230" r="180" fill="#FFF3E0" opacity="0.85"/>
  <path d="M 250 40 Q 275 80 250 110 Q 225 80 250 40 Z" fill="#FF7043" opacity="0.7"/>

  <g filter="url(#aShadow)" transform="translate(250, 250)">
    <!-- Body & Dhoti -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#aSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#aRobes)" stroke="#BF360C" stroke-width="4"/>

    <!-- Sacred Fire Flame in Hand -->
    <g transform="translate(105, 35)">
      <path d="M 0 20 Q -20 -10 0 -45 Q 20 -10 0 20 Z" fill="#FF9800" stroke="#FF5722" stroke-width="3"/>
      <path d="M 0 15 Q -10 -5 0 -30 Q 10 -5 0 15 Z" fill="#FFEB3B"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#aSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Bright Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Fiery Tilak -->
    <path d="M -12 -80 L 12 -80 L 0 -105 Z" fill="#D50000"/>
    <circle cx="0" cy="-86" r="4" fill="#FFEB3B"/>

    <!-- Flaming Crown (Mukut) -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#aCrown)" stroke="#BF360C" stroke-width="5"/>
    <!-- Flame Tips on Crown -->
    <path d="M -30 -190 Q -20 -230 0 -240 Q 20 -230 30 -190 Z" fill="#FFEB3B" stroke="#FF5722" stroke-width="2"/>
    <circle cx="0" cy="-155" r="16" fill="#E65100"/>

    <!-- Cheeks & Happy Fire Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#BF360C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>