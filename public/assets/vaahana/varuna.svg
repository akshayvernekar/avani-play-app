<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <linearGradient id="vCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="vRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
    <filter id="vShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#006064" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ocean Glow Aura with Wave Accents -->
  <circle cx="250" cy="230" r="180" fill="#E0F7FA" opacity="0.85"/>

  <g filter="url(#vShadow)" transform="translate(250, 250)">
    <!-- Ocean Blue Body & Robes -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#vSkin)" stroke="#00838F" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#vRobes)" stroke="#006064" stroke-width="4"/>

    <!-- Water Noose (Pasha) in Hand -->
    <g transform="translate(105, 30)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#FFD54F" stroke-width="5"/>
      <path d="M 0 24 Q 10 45 25 50" fill="none" stroke="#FFD54F" stroke-width="4"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#vSkin)" stroke="#00838F" stroke-width="6"/>

    <!-- Serene Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Ocean Jewel Tilak -->
    <circle cx="0" cy="-80" r="8" fill="#0288D1"/>
    <circle cx="0" cy="-80" r="3" fill="#FFF"/>

    <!-- Pearl Crown -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#vCrown)" stroke="#FF8F00" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#00ACC1"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Cheeks & Gentle Wave Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#80CBC4" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#80CBC4" opacity="0.6"/>
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#006064" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>