<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aySkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="ayCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="ayRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="ayShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1565C0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E8F5E9" opacity="0.85"/>

  <g filter="url(#ayShadow)" transform="translate(250, 250)">
    <!-- Seated in Yogic Posture with Blue Yogapatta Band -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#aySkin)" stroke="#E65100" stroke-width="5"/>
    <!-- Yogapatta knee band -->
    <path d="M -75 75 Q 0 120 75 75" fill="none" stroke="#1E88E5" stroke-width="14" stroke-linecap="round"/>

    <!-- Manikanta Golden Bell around Neck -->
    <circle cx="0" cy="42" r="12" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    <circle cx="0" cy="46" r="3" fill="#BF360C"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#aySkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Calm Devout Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Chandan Sandalwood Tilak with Kumkum Dot -->
    <ellipse cx="0" cy="-80" rx="10" ry="6" fill="#FFF9C4" stroke="#FBC02D" stroke-width="2"/>
    <circle cx="0" cy="-80" r="4" fill="#D50000"/>

    <!-- Prince Golden Crown -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#ayCrown)" stroke="#FF8F00" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#43A047"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Cheeks & Serene Divine Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -10 Q 0 14 22 -10" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>