<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="kDhoti" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <filter id="kShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0288D1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E1F5FE" opacity="0.85"/>

  <g filter="url(#kShadow)" transform="translate(250, 250)">
    <!-- Yellow Pitambari Dhoti Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#kSkin)" stroke="#0288D1" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#kDhoti)" stroke="#F57F17" stroke-width="4"/>

    <!-- Golden Flute (Bansuri) Across Chest -->
    <g transform="translate(10, 45) rotate(-15)">
      <rect x="-70" y="-8" width="140" height="16" rx="6" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
      <!-- Flute holes -->
      <circle cx="-30" cy="0" r="3" fill="#BF360C"/>
      <circle cx="-10" cy="0" r="3" fill="#BF360C"/>
      <circle cx="10" cy="0" r="3" fill="#BF360C"/>
      <circle cx="30" cy="0" r="3" fill="#BF360C"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#kSkin)" stroke="#0288D1" stroke-width="6"/>

    <!-- Curly Black Hair Topknot -->
    <circle cx="0" cy="-115" r="40" fill="#212121"/>

    <!-- Iconic Peacock Feather (Mor Pankh) in Hair -->
    <g transform="translate(25, -145) rotate(20)">
      <ellipse cx="0" cy="-25" rx="18" ry="30" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
      <ellipse cx="0" cy="-22" rx="11" ry="18" fill="#0288D1"/>
      <circle cx="0" cy="-20" r="6" fill="#1A237E"/>
      <circle cx="0" cy="-20" r="2.5" fill="#FFE082"/>
    </g>

    <!-- Mischievous Sweet Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- White Sandalwood U-Tilak with Red Dot -->
    <path d="M -12 -75 Q -12 -90 0 -90 Q 12 -90 12 -75" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-80" r="4" fill="#D50000"/>

    <!-- Cheeks & Sweet Charming Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -8 Q 0 16 22 -8" fill="none" stroke="#01579B" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>