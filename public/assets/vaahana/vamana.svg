<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <filter id="vShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.15"/>
    </filter>
  </defs>
  <circle cx="250" cy="240" r="180" fill="#FFF8E1" opacity="0.85"/>
  <g filter="url(#vShadow)" transform="translate(250, 260)">
    <!-- Wooden Umbrella on Shoulder -->
    <g transform="translate(-105, -70) rotate(-20)">
      <path d="M -80 0 C -80 -70 80 -70 80 0 Z" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="140" stroke="#5D4037" stroke-width="6"/>
      <path d="M 0 -70 L 0 -85" stroke="#FFA000" stroke-width="4"/>
    </g>
    <!-- Dhoti & Body -->
    <ellipse cx="0" cy="85" rx="70" ry="65" fill="url(#vSkin)" stroke="#E65100" stroke-width="4"/>
    <path d="M -65 60 Q 0 145 65 60 Q 0 110 -65 60 Z" fill="#FFF176" stroke="#F57F17" stroke-width="4"/>
    <!-- Head -->
    <circle cx="0" cy="-35" r="75" fill="url(#vSkin)" stroke="#E65100" stroke-width="5"/>
    <!-- Hair Shikhā / Tufts -->
    <path d="M -60 -70 C -70 -120 70 -120 60 -70 Z" fill="#212121"/>
    <ellipse cx="0" cy="-115" rx="14" ry="20" fill="#212121"/>
    <!-- Eyes -->
    <ellipse cx="-30" cy="-45" rx="12" ry="15" fill="#212121"/>
    <circle cx="-34" cy="-50" r="4" fill="#FFF"/>
    <ellipse cx="30" cy="-45" rx="12" ry="15" fill="#212121"/>
    <circle cx="26" cy="-50" r="4" fill="#FFF"/>
    <!-- Tilak -->
    <path d="M -8 -80 Q -8 -98 0 -98 Q 8 -98 8 -80" fill="none" stroke="#D84315" stroke-width="4"/>
    <circle cx="0" cy="-84" r="3" fill="#FFEB3B"/>
    <!-- Smile & Cheeks -->
    <circle cx="-45" cy="-20" r="12" fill="#FF8A80" opacity="0.6"/>
    <circle cx="45" cy="-20" r="12" fill="#FF8A80" opacity="0.6"/>
    <path d="M -18 -10 Q 0 12 18 -10" fill="none" stroke="#BF360C" stroke-width="4" stroke-linecap="round"/>
    <!-- Kamandalu in hand -->
    <g transform="translate(85, 60)">
      <ellipse cx="0" cy="15" rx="18" ry="24" fill="#FFA726" stroke="#E65100" stroke-width="3"/>
      <path d="M -12 0 C -12 -20 12 -20 12 0" fill="none" stroke="#E65100" stroke-width="3"/>
    </g>
  </g>
</svg>