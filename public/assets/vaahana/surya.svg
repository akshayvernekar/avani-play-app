<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="suSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCA28"/>
    </linearGradient>
    <linearGradient id="suCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="suDhoti" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <filter id="suShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#E65100" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Radiant Sunbeam Aura -->
  <circle cx="250" cy="230" r="185" fill="#FFF8E1" opacity="0.9"/>
  <!-- Sun Rays Pattern -->
  <g stroke="#FFD54F" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="250" y1="20" x2="250" y2="45"/>
    <line x1="100" y1="80" x2="118" y2="98"/>
    <line x1="400" y1="80" x2="382" y2="98"/>
    <line x1="40" y1="230" x2="65" y2="230"/>
    <line x1="460" y1="230" x2="435" y2="230"/>
  </g>

  <g filter="url(#suShadow)" transform="translate(250, 250)">
    <!-- Golden Body & Orange Robes -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#suSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#suDhoti)" stroke="#BF360C" stroke-width="4"/>

    <!-- Left & Right Hands Holding Radiant Red Lotuses -->
    <g transform="translate(-105, 35)">
      <path d="M -16 0 C -26 -24 0 -38 0 -38 C 0 -38 26 -24 16 0 Z" fill="#FF5252" stroke="#C62828" stroke-width="2"/>
      <circle cx="0" cy="-14" r="8" fill="#FF8A80"/>
    </g>
    <g transform="translate(105, 35)">
      <path d="M -16 0 C -26 -24 0 -38 0 -38 C 0 -38 26 -24 16 0 Z" fill="#FF5252" stroke="#C62828" stroke-width="2"/>
      <circle cx="0" cy="-14" r="8" fill="#FF8A80"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#suSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Radiant Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Solar Tilak -->
    <circle cx="0" cy="-80" r="10" fill="#E53935"/>
    <circle cx="0" cy="-80" r="4" fill="#FFF"/>

    <!-- Solar Crown (Mukut with Sunburst) -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#suCrown)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-155" r="20" fill="#FF5722"/>
    <circle cx="0" cy="-155" r="9" fill="#FFF176"/>

    <!-- Golden Earrings (Kundala) -->
    <circle cx="-80" cy="-25" r="12" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    <circle cx="80" cy="-25" r="12" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>

    <!-- Cheeks & Radiant Warm Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>