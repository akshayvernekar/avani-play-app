<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="snSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <linearGradient id="nandiBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <filter id="snShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#37474F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="220" r="190" fill="#E0F2F1" opacity="0.7"/>

  <g filter="url(#snShadow)">
    <!-- Nandi the Bull sitting below/beside Shiva -->
    <g transform="translate(150, 310)">
      <!-- Bull Hump -->
      <circle cx="10" cy="-20" r="35" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="4"/>
      <!-- Bull Body -->
      <ellipse cx="40" cy="20" rx="120" ry="60" fill="url(#nandiBody)" stroke="#B0BEC5" stroke-width="6"/>
      <!-- Decorative Shawl on Bull -->
      <path d="M 0 -5 Q 40 40 80 -5 Z" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
      <!-- Bull Head -->
      <ellipse cx="-60" cy="0" rx="45" ry="38" fill="url(#nandiBody)" stroke="#B0BEC5" stroke-width="5"/>
      <!-- Horns -->
      <path d="M -75 -25 Q -85 -55 -65 -65 Q -55 -45 -60 -25 Z" fill="#FFE082" stroke="#FFB300" stroke-width="3"/>
      <path d="M -45 -25 Q -35 -55 -55 -65 Q -45 -45 -40 -25 Z" fill="#FFE082" stroke="#FFB300" stroke-width="3"/>
      <!-- Ears -->
      <ellipse cx="-85" cy="0" rx="18" ry="10" fill="#FFCDD2" stroke="#B0BEC5" stroke-width="3"/>
      <!-- Bell Collar -->
      <path d="M -80 15 Q -60 40 -35 25" fill="none" stroke="#FFB300" stroke-width="6"/>
      <circle cx="-55" cy="30" r="8" fill="#FFC107" stroke="#FFA000" stroke-width="2"/>
      <!-- Eye -->
      <ellipse cx="-70" cy="-8" rx="6" ry="8" fill="#212121"/>
      <circle cx="-72" cy="-10" r="2" fill="#FFF"/>
      <!-- Muzzle -->
      <ellipse cx="-95" cy="12" rx="16" ry="14" fill="#FFCDD2"/>
    </g>

    <!-- Shiva sitting joyfully with Nandi -->
    <g transform="translate(260, 200)">
      <!-- Trishul -->
      <g transform="translate(110, -50)">
        <line x1="0" y1="-50" x2="0" y2="200" stroke="#FFB300" stroke-width="7"/>
        <path d="M -25 -80 Q -25 -40 0 -30 Q 25 -40 25 -80" fill="none" stroke="#FFB300" stroke-width="6"/>
        <line x1="0" y1="-95" x2="0" y2="-30" stroke="#FFB300" stroke-width="6"/>
      </g>

      <!-- Body -->
      <ellipse cx="0" cy="70" rx="70" ry="60" fill="url(#snSkin)" stroke="#0097A7" stroke-width="5"/>
      <path d="M -60 45 Q 0 120 60 45 Z" fill="#FB8C00" stroke="#E65100" stroke-width="4"/>

      <!-- Snake -->
      <path d="M -35 15 Q 0 40 35 15" fill="none" stroke="#43A047" stroke-width="10"/>

      <!-- Head -->
      <circle cx="0" cy="-25" r="70" fill="url(#snSkin)" stroke="#0097A7" stroke-width="5"/>

      <!-- Hair Bun & Moon -->
      <ellipse cx="0" cy="-90" rx="45" ry="32" fill="#212121"/>
      <path d="M 28 -120 A 18 18 0 0 1 12 -95 A 18 18 0 0 0 36 -112 Z" fill="#FFF59D"/>

      <!-- Eyes -->
      <ellipse cx="-28" cy="-35" rx="10" ry="12" fill="#212121"/>
      <circle cx="-31" cy="-39" r="4" fill="#FFF"/>
      <ellipse cx="28" cy="-35" rx="10" ry="12" fill="#212121"/>
      <circle cx="24" cy="-39" r="4" fill="#FFF"/>

      <!-- Tripundra -->
      <line x1="-20" y1="-72" x2="20" y2="-72" stroke="#FFF" stroke-width="3.5"/>
      <line x1="-20" y1="-66" x2="20" y2="-66" stroke="#FFF" stroke-width="3.5"/>
      <ellipse cx="0" cy="-66" rx="3" ry="5" fill="#E53935"/>

      <!-- Smile -->
      <path d="M -18 -5 Q 0 15 18 -5" fill="none" stroke="#006064" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cheeks -->
      <circle cx="-42" cy="-18" r="12" fill="#FF8A80" opacity="0.5"/>
      <circle cx="42" cy="-18" r="12" fill="#FF8A80" opacity="0.5"/>
    </g>
  </g>
</svg>
