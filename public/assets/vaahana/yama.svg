<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ySkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
    <linearGradient id="yCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="yRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="yShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1B5E20" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E8F5E9" opacity="0.85"/>

  <g filter="url(#yShadow)" transform="translate(250, 250)">
    <!-- Red Robes Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#ySkin)" stroke="#2E7D32" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#yRobes)" stroke="#B71C1C" stroke-width="4"/>

    <!-- Golden Mace (Gada) in Right Hand -->
    <g transform="translate(110, 25)">
      <line x1="0" y1="40" x2="0" y2="-40" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="-45" r="18" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#ySkin)" stroke="#2E7D32" stroke-width="6"/>

    <!-- Noble Chibi Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Red Tilak -->
    <path d="M -14 -82 L 14 -82 L 0 -105 Z" fill="#D50000"/>
    <circle cx="0" cy="-88" r="4" fill="#FFEB3B"/>

    <!-- Majestic Dharmaraja Crown with Horn Motifs -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#yCrown)" stroke="#FF8F00" stroke-width="5"/>
    <path d="M -70 -110 Q -95 -130 -85 -160 Q -70 -130 -55 -120" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    <path d="M 70 -110 Q 95 -130 85 -160 Q 70 -130 55 -120" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    <circle cx="0" cy="-155" r="18" fill="#D50000"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Cheeks & Dignified Friendly Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#A5D6A7" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#A5D6A7" opacity="0.6"/>
    <path d="M -22 -10 Q 0 14 22 -10" fill="none" stroke="#1B5E20" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>