<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCC80"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="hCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="hDhoti" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <filter id="hShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#E64A19" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#FFF3E0" opacity="0.85"/>

  <g filter="url(#hShadow)" transform="translate(250, 250)">
    <!-- Cheerful Curled Monkey Tail with Bell -->
    <path d="M -60 110 C -140 100 -160 0 -130 -30 C -105 -55 -80 -20 -95 10" fill="none" stroke="#FFA726" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-95" cy="15" r="9" fill="#FFD54F" stroke="#FF8F00" stroke-width="2"/>

    <!-- Strong Chibi Body & Saffron Dhoti -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#hSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#hDhoti)" stroke="#BF360C" stroke-width="4"/>

    <!-- Golden Gada (Mace) on Shoulder -->
    <g transform="translate(110, 10)">
      <line x1="0" y1="60" x2="0" y2="-50" stroke="#FFB300" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="0" cy="-55" rx="22" ry="26" fill="#FFD54F" stroke="#FF8F00" stroke-width="3"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#hSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Cute Monkey Snout/Mouth Area -->
    <ellipse cx="0" cy="-10" rx="42" ry="32" fill="#FFE0B2" stroke="#E65100" stroke-width="3"/>

    <!-- Large Cheerful Chibi Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Sacred Red Vermilion Tilak -->
    <path d="M -12 -75 L 12 -75 L 0 -100 Z" fill="#D50000"/>
    <circle cx="0" cy="-82" r="4" fill="#FFEB3B"/>

    <!-- Golden Mukut -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#hCrown)" stroke="#FF8F00" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#D50000"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Rosy Cheeks & Big Joyful Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -6 Q 0 18 22 -6" fill="none" stroke="#BF360C" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>