<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sarSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="sarCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="sarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#880E4F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="230" r="180" fill="#FCE4EC" opacity="0.8"/>

  <g filter="url(#sarShadow)" transform="translate(250, 250)">
    <!-- White & Pink Silk Sari Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#sarSkin)" stroke="#F06292" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="#FFFFFF" stroke="#F48FB1" stroke-width="4"/>

    <!-- Veena Instrument held across body -->
    <g transform="translate(0, 50) rotate(-25)">
      <!-- Veena neck -->
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#8D6E63" stroke-width="12" stroke-linecap="round"/>
      <line x1="-115" y1="-3" x2="115" y2="-3" stroke="#FFD54F" stroke-width="3"/>
      <!-- Veena Gourds -->
      <circle cx="-100" cy="15" r="28" fill="#D7CCC8" stroke="#5D4037" stroke-width="4"/>
      <circle cx="90" cy="12" r="22" fill="#D7CCC8" stroke="#5D4037" stroke-width="4"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#sarSkin)" stroke="#F06292" stroke-width="6"/>

    <!-- Eyes (Gentle & Wise) -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Tilak / Bindi -->
    <circle cx="0" cy="-80" r="8" fill="#EC407A"/>
    <circle cx="0" cy="-80" r="3" fill="#FFF"/>

    <!-- Crown (Mukut) -->
    <path d="M -75 -95 L 75 -95 L 55 -185 L 0 -215 L -55 -185 Z" fill="url(#sarCrown)" stroke="#F57F17" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#EC407A"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Smile & Cheeks -->
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#C2185B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
