<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lakshmiSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="lakshmiCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="lakshmiSari" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>
    <filter id="lakshmiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#AD1457" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Golden Aura Glow -->
  <circle cx="250" cy="230" r="180" fill="#FFF8E1" opacity="0.85"/>
  <circle cx="250" cy="230" r="150" fill="#FFE082" opacity="0.3"/>

  <g filter="url(#lakshmiShadow)" transform="translate(250, 250)">
    <!-- Pink Sari Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#lakshmiSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#lakshmiSari)" stroke="#880E4F" stroke-width="4"/>

    <!-- Lotus Blossoms in Hands -->
    <!-- Left Hand Lotus -->
    <g transform="translate(-100, 30)">
      <path d="M -16 0 C -26 -24 0 -38 0 -38 C 0 -38 26 -24 16 0 Z" fill="#F48FB1" stroke="#C2185B" stroke-width="2"/>
      <path d="M -8 0 C -16 -18 0 -28 0 -28 C 0 -28 16 -18 8 0 Z" fill="#FF4081"/>
      <ellipse cx="0" cy="-6" rx="6" ry="10" fill="#F8BBD0"/>
    </g>

    <!-- Right Hand Lotus -->
    <g transform="translate(100, 30)">
      <path d="M -16 0 C -26 -24 0 -38 0 -38 C 0 -38 26 -24 16 0 Z" fill="#F48FB1" stroke="#C2185B" stroke-width="2"/>
      <path d="M -8 0 C -16 -18 0 -28 0 -28 C 0 -28 16 -18 8 0 Z" fill="#FF4081"/>
      <ellipse cx="0" cy="-6" rx="6" ry="10" fill="#F8BBD0"/>
    </g>

    <!-- Showering Gold Coins from Lower Right Hand -->
    <circle cx="55" cy="115" r="9" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>
    <circle cx="75" cy="130" r="8" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>
    <circle cx="95" cy="142" r="7" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#lakshmiSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Eyes (Big Beautiful Chibi Eyes) -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Red Bindi & Pearl Chandrika -->
    <circle cx="0" cy="-80" r="9" fill="#D50000"/>
    <circle cx="0" cy="-80" r="3.5" fill="#FFD54F"/>

    <!-- Silky Black Hair Framing Face -->
    <path d="M -80 -30 C -95 30 -85 90 -65 110" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>
    <path d="M 80 -30 C 95 30 85 90 65 110" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>

    <!-- Golden Crown (Mukut) -->
    <path d="M -75 -95 L 75 -95 L 55 -185 L 0 -215 L -55 -185 Z" fill="url(#lakshmiCrown)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#E91E63"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Nose Ring (Nath) -->
    <circle cx="-16" cy="-22" r="7" fill="none" stroke="#FFD54F" stroke-width="3"/>

    <!-- Cheeks & Sweet Smile -->
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
