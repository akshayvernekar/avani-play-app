<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lManeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="lFaceCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="lSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#BF360C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#lSh)" transform="translate(250, 250)">
    <!-- Fluffy Mane -->
    <path d="M 0 -180 
             Q 45 -160 70 -170 Q 100 -135 125 -125 Q 140 -80 165 -55 Q 150 -5 165 25
             Q 135 65 140 100 Q 100 125 80 155 Q 35 145 0 170
             Q -35 145 -80 155 Q -100 125 -140 100 Q -135 65 -165 25
             Q -150 -5 -165 -55 Q -140 -80 -125 -125 Q -100 -135 -70 -170 Z" 
          fill="url(#lManeCard)" stroke="#BF360C" stroke-width="7"/>

    <!-- Head Face -->
    <circle cx="0" cy="0" r="95" fill="url(#lFaceCard)" stroke="#FF8F00" stroke-width="6"/>

    <!-- Ears -->
    <circle cx="-75" cy="-85" r="28" fill="#FFB300" stroke="#BF360C" stroke-width="4"/>
    <circle cx="-75" cy="-85" r="15" fill="#FF8F00"/>
    <circle cx="75" cy="-85" r="28" fill="#FFB300" stroke="#BF360C" stroke-width="4"/>
    <circle cx="75" cy="-85" r="15" fill="#FF8F00"/>

    <!-- Muzzle -->
    <ellipse cx="0" cy="28" rx="45" ry="32" fill="#FFF8E1"/>

    <!-- Nose -->
    <path d="M -18 8 L 18 8 L 0 28 Z" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>

    <!-- Mouth -->
    <path d="M 0 28 L 0 40" stroke="#3E2723" stroke-width="4"/>
    <path d="M -20 40 Q 0 60 20 40" fill="none" stroke="#3E2723" stroke-width="4" stroke-linecap="round"/>

    <!-- Big Eyes -->
    <circle cx="-38" cy="-20" r="13" fill="#212121"/>
    <circle cx="-42" cy="-24" r="4.5" fill="#FFF"/>
    <circle cx="38" cy="-20" r="13" fill="#212121"/>
    <circle cx="42" cy="-24" r="4.5" fill="#FFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-60" cy="12" r="13" fill="#FF8A80" opacity="0.6"/>
    <circle cx="60" cy="12" r="13" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
