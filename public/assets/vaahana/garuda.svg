<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="garudaWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="gSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#E65100" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#gSh)" transform="translate(250, 250)">
    <!-- Golden Wings -->
    <path d="M -30 20 C -130 -40 -190 0 -170 60 C -120 70 -60 40 -30 30 Z" fill="url(#garudaWings)" stroke="#E65100" stroke-width="5"/>
    <path d="M 30 20 C 130 -40 190 0 170 60 C 120 70 60 40 30 30 Z" fill="url(#garudaWings)" stroke="#E65100" stroke-width="5"/>

    <!-- Eagle Body -->
    <ellipse cx="0" cy="40" rx="75" ry="60" fill="#FFF3E0" stroke="#E65100" stroke-width="6"/>

    <!-- Head -->
    <circle cx="0" cy="-35" r="55" fill="#FFF3E0" stroke="#E65100" stroke-width="6"/>

    <!-- Beak -->
    <path d="M 0 -30 L -30 -15 C -25 10 0 15 10 -5 Z" fill="#FFC107" stroke="#E65100" stroke-width="4"/>

    <!-- Eyes -->
    <circle cx="-20" cy="-45" r="10" fill="#212121"/>
    <circle cx="-23" cy="-49" r="3.5" fill="#FFF"/>
    <circle cx="20" cy="-45" r="10" fill="#212121"/>
    <circle cx="17" cy="-49" r="3.5" fill="#FFF"/>

    <!-- Small Golden Crown on Head -->
    <path d="M -25 -80 L 25 -80 L 0 -110 Z" fill="#FFD54F" stroke="#E65100" stroke-width="3"/>
    <circle cx="0" cy="-95" r="5" fill="#E53935"/>
  </g>
</svg>
