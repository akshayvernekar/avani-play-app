<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shivaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </linearGradient>
    <linearGradient id="shivaHair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E342E"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <filter id="sShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#006064" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="230" r="180" fill="#E0F2F1" opacity="0.7"/>

  <g filter="url(#sShadow)" transform="translate(250, 250)">
    <!-- Trishul (Trident) on the side -->
    <g transform="translate(130, -40)">
      <line x1="0" y1="-80" x2="0" y2="240" stroke="#FFB300" stroke-width="8" stroke-linecap="round"/>
      <path d="M -30 -120 Q -30 -70 0 -50 Q 30 -70 30 -120" fill="none" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="-140" x2="0" y2="-50" stroke="#FFB300" stroke-width="7"/>
      <!-- Small Damru drum on trident -->
      <path d="M -15 -10 L 15 -10 L -15 10 L 15 10 Z" fill="#E65100" stroke="#BF360C" stroke-width="3"/>
    </g>

    <!-- Body & Tiger cloth -->
    <ellipse cx="0" cy="90" rx="80" ry="70" fill="url(#shivaSkin)" stroke="#0097A7" stroke-width="5"/>
    <path d="M -75 60 Q 0 150 75 60 Q 0 120 -75 60 Z" fill="#FB8C00" stroke="#E65100" stroke-width="4"/>

    <!-- Cobra around neck -->
    <path d="M -45 20 Q 0 50 45 20 Q 55 5 40 5" fill="none" stroke="#43A047" stroke-width="14" stroke-linecap="round"/>
    <circle cx="45" cy="5" r="8" fill="#43A047"/>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#shivaSkin)" stroke="#0097A7" stroke-width="6"/>

    <!-- Hair Bun (Jata) -->
    <ellipse cx="0" cy="-110" rx="55" ry="40" fill="url(#shivaHair)" stroke="#212121" stroke-width="4"/>
    <circle cx="0" cy="-140" r="30" fill="url(#shivaHair)"/>

    <!-- Crescent Moon on Hair -->
    <path d="M 35 -145 A 22 22 0 0 1 15 -115 A 22 22 0 0 0 45 -135 Z" fill="#FFF59D" stroke="#FBC02D" stroke-width="2"/>

    <!-- Ganga wave accent -->
    <path d="M 0 -170 Q -15 -185 0 -200 Q 15 -185 0 -170 Z" fill="#4FC3F7"/>

    <!-- Eyes (Serene & Gentle) -->
    <ellipse cx="-32" cy="-40" rx="12" ry="14" fill="#212121"/>
    <circle cx="-35" cy="-44" r="4.5" fill="#FFF"/>
    <ellipse cx="32" cy="-40" rx="12" ry="14" fill="#212121"/>
    <circle cx="28" cy="-44" r="4.5" fill="#FFF"/>

    <!-- Tripundra (3 White Lines) & Third Eye -->
    <line x1="-25" y1="-85" x2="25" y2="-85" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-25" y1="-78" x2="25" y2="-78" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-25" y1="-71" x2="25" y2="-71" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="-78" rx="4" ry="7" fill="#E53935"/>

    <!-- Smile -->
    <path d="M -22 -5 Q 0 20 22 -5" fill="none" stroke="#006064" stroke-width="4" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.5"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.5"/>
  </g>
</svg>
