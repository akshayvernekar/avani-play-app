<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="iSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="iCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="iArmor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="iShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0D47A1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E1F5FE" opacity="0.85"/>

  <g filter="url(#iShadow)" transform="translate(250, 250)">
    <!-- Royal Armor & Dhoti -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#iSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#iArmor)" stroke="#0D47A1" stroke-width="4"/>

    <!-- Thunderbolt (Vajra) in Right Hand -->
    <g transform="translate(115, 30)">
      <!-- Vajra Center & Prongs -->
      <circle cx="0" cy="0" r="8" fill="#FFD700" stroke="#FF8F00" stroke-width="2"/>
      <path d="M -8 -8 L -18 -35 L 0 -45 L 18 -35 L 8 -8 Z" fill="#FFE082" stroke="#FF8F00" stroke-width="3"/>
      <path d="M -8 8 L -18 35 L 0 45 L 18 35 L 8 8 Z" fill="#FFE082" stroke="#FF8F00" stroke-width="3"/>
      <!-- Lightning Sparks -->
      <path d="M -22 -10 L -30 0 L -20 5" stroke="#FFEB3B" stroke-width="3" fill="none"/>
      <path d="M 22 -10 L 30 0 L 20 5" stroke="#FFEB3B" stroke-width="3" fill="none"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#iSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Royal Third-Eye / Indrakshi Mark & Red Tilak -->
    <path d="M -15 -85 L 15 -85 L 0 -105 Z" fill="#E53935"/>
    <ellipse cx="0" cy="-75" rx="10" ry="5" fill="#FFE082" stroke="#FF8F00" stroke-width="2"/>

    <!-- Big Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- King of Devas Golden Crown -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#iCrown)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#1E88E5"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Cheeks & Confident Royal Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>