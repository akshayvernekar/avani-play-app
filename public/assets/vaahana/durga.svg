<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="durgaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="durgaCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="sariGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <filter id="dShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#BF360C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Golden Aura Behind -->
  <circle cx="250" cy="230" r="180" fill="#FFF8E1" opacity="0.8"/>

  <g filter="url(#dShadow)" transform="translate(250, 250)">
    <!-- Red Sari Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#durgaSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#sariGrad)" stroke="#B71C1C" stroke-width="4"/>

    <!-- Lotus held in hand -->
    <g transform="translate(100, 40)">
      <path d="M -15 0 C -25 -25 0 -40 0 -40 C 0 -40 25 -25 15 0 Z" fill="#F48FB1" stroke="#C2185B" stroke-width="2"/>
      <path d="M -8 0 C -15 -18 0 -30 0 -30 C 0 -30 15 -18 8 0 Z" fill="#F06292"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#durgaSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Eyes (Big Beautiful Eyes) -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Red Bindi & Golden Chandrika -->
    <circle cx="0" cy="-80" r="10" fill="#D50000"/>
    <circle cx="0" cy="-80" r="4" fill="#FFD54F"/>

    <!-- Long Hair Flanking -->
    <path d="M -80 -30 C -95 30 -85 90 -65 110" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>
    <path d="M 80 -30 C 95 30 85 90 65 110" fill="none" stroke="#212121" stroke-width="16" stroke-linecap="round"/>

    <!-- Gorgeous Crown (Mukut) -->
    <path d="M -75 -95 L 75 -95 L 55 -185 L 0 -215 L -55 -185 Z" fill="url(#durgaCrown)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#D50000"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Nose Ring (Nath) -->
    <circle cx="-16" cy="-22" r="8" fill="none" stroke="#FFD54F" stroke-width="3"/>

    <!-- Cheeks & Smile -->
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
