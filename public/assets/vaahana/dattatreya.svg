<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dtSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="dtRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <filter id="dtShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#E65100" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#FFF8E1" opacity="0.85"/>

  <g filter="url(#dtShadow)" transform="translate(250, 250)">
    <!-- Ascetic Orange Robes Body -->
    <ellipse cx="0" cy="90" rx="85" ry="75" fill="url(#dtSkin)" stroke="#E65100" stroke-width="5"/>
    <path d="M -80 60 Q 0 160 80 60 Q 0 120 -80 60 Z" fill="url(#dtRobes)" stroke="#BF360C" stroke-width="4"/>

    <!-- Left Face (Brahma) -->
    <g transform="translate(-60, -30) scale(0.85)">
      <circle cx="0" cy="0" r="65" fill="#FFE0B2" stroke="#E65100" stroke-width="4"/>
      <ellipse cx="-15" cy="-10" rx="8" ry="10" fill="#212121"/>
      <!-- Ascetic bun -->
      <circle cx="0" cy="-70" r="30" fill="#4E342E"/>
    </g>

    <!-- Right Face (Shiva) -->
    <g transform="translate(60, -30) scale(0.85)">
      <circle cx="0" cy="0" r="65" fill="#E0F7FA" stroke="#0097A7" stroke-width="4"/>
      <ellipse cx="15" cy="-10" rx="8" ry="10" fill="#212121"/>
      <!-- Crescent moon bun -->
      <circle cx="0" cy="-70" r="30" fill="#4E342E"/>
      <path d="M 15 -75 A 12 12 0 0 1 5 -60 A 12 12 0 0 0 20 -70 Z" fill="#FFF59D"/>
    </g>

    <!-- Center Face (Vishnu) -->
    <circle cx="0" cy="-30" r="75" fill="url(#dtSkin)" stroke="#E65100" stroke-width="6"/>

    <!-- Center Eyes -->
    <ellipse cx="-32" cy="-45" rx="13" ry="15" fill="#212121"/>
    <circle cx="-36" cy="-49" r="4.5" fill="#FFF"/>
    <ellipse cx="32" cy="-45" rx="13" ry="15" fill="#212121"/>
    <circle cx="28" cy="-49" r="4.5" fill="#FFF"/>

    <!-- Tilak -->
    <path d="M -12 -80 L 12 -80 L 0 -100 Z" fill="#D50000"/>
    <circle cx="0" cy="-86" r="4" fill="#FFEB3B"/>

    <!-- Vishnu Golden Crown for Center Head -->
    <path d="M -65 -90 L 65 -90 L 45 -180 L 0 -210 L -45 -180 Z" fill="#FFCA28" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-150" r="16" fill="#E91E63"/>

    <!-- Cheeks & Gentle Peaceful Sage Smile -->
    <circle cx="-46" cy="-20" r="12" fill="#FF8A80" opacity="0.6"/>
    <circle cx="46" cy="-20" r="12" fill="#FF8A80" opacity="0.6"/>
    <path d="M -20 -8 Q 0 12 20 -8" fill="none" stroke="#BF360C" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>