<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <g transform="translate(250, 250)">
    <!-- Fluffy Mane -->
    <path d="M 0 -220 
             Q 50 -200 80 -210 Q 120 -170 150 -160 Q 170 -100 200 -70 Q 180 -10 200 30
             Q 160 80 170 120 Q 120 150 100 190 Q 40 180 0 210
             Q -40 180 -100 190 Q -120 150 -170 120 Q -160 80 -200 30
             Q -180 -10 -200 -70 Q -170 -100 -150 -160 Q -120 -170 -80 -210 Z" 
          fill="url(#maneGrad)" stroke="#BF360C" stroke-width="8"/>
          
    <!-- Ears -->
    <circle cx="-100" cy="-110" r="35" fill="#FFB300" stroke="#BF360C" stroke-width="5"/>
    <circle cx="-100" cy="-110" r="20" fill="#FF8F00"/>
    <circle cx="100" cy="-110" r="35" fill="#FFB300" stroke="#BF360C" stroke-width="5"/>
    <circle cx="100" cy="-110" r="20" fill="#FF8F00"/>

    <!-- Head Face -->
    <circle cx="0" cy="0" r="120" fill="url(#faceGrad)" stroke="#FF8F00" stroke-width="6"/>
    
    <!-- Muzzle -->
    <ellipse cx="0" cy="35" rx="55" ry="40" fill="#FFF8E1"/>
    
    <!-- Nose -->
    <path d="M -22 10 L 22 10 L 0 35 Z" fill="#4E342E" stroke="#3E2723" stroke-width="3"/>
    
    <!-- Mouth -->
    <path d="M 0 35 L 0 50" stroke="#3E2723" stroke-width="5"/>
    <path d="M -25 50 Q 0 75 25 50" fill="none" stroke="#3E2723" stroke-width="5" stroke-linecap="round"/>

    <!-- Big Friendly Eyes -->
    <circle cx="-45" cy="-25" r="16" fill="#212121"/>
    <circle cx="-40" cy="-30" r="6" fill="#FFF"/>
    <circle cx="45" cy="-25" r="16" fill="#212121"/>
    <circle cx="50" cy="-30" r="6" fill="#FFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-75" cy="15" r="16" fill="#FF8A80" opacity="0.5"/>
    <circle cx="75" cy="15" r="16" fill="#FF8A80" opacity="0.5"/>
  </g>
</svg>
