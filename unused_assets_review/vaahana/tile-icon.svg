<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="ganeshaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5D4037" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle with Soft Border -->
  <circle cx="250" cy="250" r="220" fill="url(#tileBg)" stroke="#FF9800" stroke-width="10"/>

  <!-- Glowing Arch Backing -->
  <path d="M 130 380 Q 250 100 370 380 Z" fill="#FFE082" opacity="0.3"/>

  <!-- Sparkles/Stars -->
  <path d="M 120 140 L 126 154 L 140 160 L 126 166 L 120 180 L 114 166 L 100 160 L 114 154 Z" fill="#FFB300"/>
  <path d="M 370 120 L 375 132 L 387 137 L 375 142 L 370 154 L 365 142 L 353 137 L 365 132 Z" fill="#FFB300"/>
  <circle cx="390" cy="220" r="10" fill="#E91E63" opacity="0.8"/>
  <circle cx="100" cy="280" r="8" fill="#4CAF50" opacity="0.8"/>

  <!-- Ganesha Group -->
  <g filter="url(#shadow)" transform="translate(200, 240)">
    <!-- Ears -->
    <ellipse cx="-75" cy="-30" rx="45" ry="35" fill="#FFAB91" stroke="#E64A19" stroke-width="4"/>
    <ellipse cx="-75" cy="-30" rx="25" ry="20" fill="#FF8A65"/>
    <ellipse cx="75" cy="-30" rx="45" ry="35" fill="#FFAB91" stroke="#E64A19" stroke-width="4"/>
    <ellipse cx="75" cy="-30" rx="25" ry="20" fill="#FF8A65"/>

    <!-- Head -->
    <ellipse cx="0" cy="-20" rx="65" ry="60" fill="url(#ganeshaSkin)" stroke="#E64A19" stroke-width="5"/>

    <!-- Eyes -->
    <ellipse cx="-30" cy="-35" rx="10" ry="12" fill="#212121"/>
    <circle cx="-33" cy="-39" r="4" fill="#FFF"/>
    <ellipse cx="30" cy="-35" rx="10" ry="12" fill="#212121"/>
    <circle cx="27" cy="-39" r="4" fill="#FFF"/>

    <!-- Tilak -->
    <path d="M -12 -65 L 12 -65 L 15 -75 L 0 -85 L -15 -75 Z" fill="#E53935"/>
    <circle cx="0" cy="-70" r="4" fill="#FFEB3B"/>

    <!-- Trunk -->
    <path d="M -15 0 C -20 40 25 50 35 25 C 40 10 25 5 18 18" fill="none" stroke="#E64A19" stroke-width="18" stroke-linecap="round"/>
    <path d="M -15 0 C -20 40 25 50 35 25 C 40 10 25 5 18 18" fill="none" stroke="#FFAB91" stroke-width="10" stroke-linecap="round"/>

    <!-- Crown (Mukut) -->
    <path d="M -50 -70 L 50 -70 L 35 -140 L 0 -160 L -35 -140 Z" fill="url(#crownGrad)" stroke="#F57F17" stroke-width="5"/>
    <circle cx="0" cy="-110" r="12" fill="#E91E63"/>
    <circle cx="0" cy="-110" r="6" fill="#FFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-45" cy="-10" r="12" fill="#FF8A80" opacity="0.6"/>
    <circle cx="45" cy="-10" r="12" fill="#FF8A80" opacity="0.6"/>
  </g>

  <!-- Cute Mooshika (Mouse) next to Ganesha -->
  <g filter="url(#shadow)" transform="translate(340, 320)">
    <!-- Tail -->
    <path d="M 30 20 Q 60 10 50 -20" fill="none" stroke="#78909C" stroke-width="5" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="0" cy="10" rx="35" ry="28" fill="url(#mouseGrad)" stroke="#37474F" stroke-width="4"/>
    <!-- Head -->
    <circle cx="-25" cy="-5" r="22" fill="url(#mouseGrad)" stroke="#37474F" stroke-width="4"/>
    <!-- Ears -->
    <circle cx="-20" cy="-25" r="12" fill="#FF8A80" stroke="#37474F" stroke-width="3"/>
    <!-- Eye -->
    <circle cx="-32" cy="-10" r="4" fill="#212121"/>
    <circle cx="-33" cy="-12" r="1.5" fill="#FFF"/>
    <!-- Modak in hand -->
    <path d="M -40 10 Q -35 -5 -30 10 Z" fill="#FFB300" stroke="#E65100" stroke-width="2"/>
  </g>
</svg>
