<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vgSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B3E5FC"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
    <linearGradient id="gFeathers" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <filter id="vgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0277BD" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="220" r="190" fill="#E1F5FE" opacity="0.7"/>

  <g filter="url(#vgShadow)">
    <!-- Garuda Eagle Mount -->
    <g transform="translate(250, 300)">
      <!-- Golden Wings spread out -->
      <path d="M -50 0 C -150 -50 -220 -20 -200 40 C -150 50 -80 30 -50 10 Z" fill="url(#gFeathers)" stroke="#E65100" stroke-width="4"/>
      <path d="M 50 0 C 150 -50 220 -20 200 40 C 150 50 80 30 50 10 Z" fill="url(#gFeathers)" stroke="#E65100" stroke-width="4"/>
      <!-- Body -->
      <ellipse cx="0" cy="30" rx="75" ry="50" fill="#FFF3E0" stroke="#E65100" stroke-width="5"/>
      <!-- Head & Beak -->
      <circle cx="-60" cy="0" r="32" fill="#FFF3E0" stroke="#E65100" stroke-width="4"/>
      <!-- Golden Beak -->
      <path d="M -75 0 L -105 10 L -75 22 Z" fill="#FFB300" stroke="#E65100" stroke-width="3"/>
      <!-- Eye -->
      <circle cx="-70" cy="-8" r="6" fill="#212121"/>
      <circle cx="-72" cy="-10" r="2" fill="#FFF"/>
      <!-- Crown on Garuda -->
      <path d="M -70 -25 L -50 -25 L -60 -45 Z" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    </g>

    <!-- Vishnu sitting gracefully on Garuda -->
    <g transform="translate(250, 190)">
      <!-- Body -->
      <ellipse cx="0" cy="70" rx="68" ry="55" fill="url(#vgSkin)" stroke="#0288D1" stroke-width="4"/>
      <path d="M -60 45 Q 0 120 60 45 Z" fill="#FFEE58" stroke="#F57F17" stroke-width="4"/>

      <!-- Head -->
      <circle cx="0" cy="-25" r="68" fill="url(#vgSkin)" stroke="#0288D1" stroke-width="5"/>

      <!-- Crown -->
      <path d="M -60 -80 L 60 -80 L 45 -155 L 0 -180 L -45 -155 Z" fill="#FFD54F" stroke="#F57F17" stroke-width="5"/>
      <circle cx="0" cy="-130" r="14" fill="#29B6F6"/>

      <!-- Eyes -->
      <ellipse cx="-28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="-31" cy="-42" r="4" fill="#FFF"/>
      <ellipse cx="28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="25" cy="-42" r="4" fill="#FFF"/>

      <!-- Tilak -->
      <path d="M -12 -75 L -12 -60 Q 0 -48 12 -60 L 12 -75 Z" fill="#FFF" stroke="#E53935" stroke-width="1.5"/>

      <!-- Smile & Cheeks -->
      <path d="M -18 -8 Q 0 12 18 -8" fill="none" stroke="#0277BD" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
      <circle cx="40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
    </g>
  </g>
</svg>
