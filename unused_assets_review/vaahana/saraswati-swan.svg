<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ssSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E1"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="swanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECEFF1"/>
    </linearGradient>
    <filter id="ssShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#880E4F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow -->
  <circle cx="250" cy="220" r="190" fill="#FCE4EC" opacity="0.7"/>

  <!-- Water Lotus Base -->
  <ellipse cx="250" cy="380" rx="190" ry="40" fill="#80DEEA" opacity="0.5"/>

  <g filter="url(#ssShadow)">
    <!-- Graceful Swan Companion beside Saraswati -->
    <g transform="translate(140, 300)">
      <!-- Swan Body -->
      <ellipse cx="20" cy="20" rx="90" ry="50" fill="url(#swanGrad)" stroke="#B0BEC5" stroke-width="4"/>
      <!-- Swan Neck -->
      <path d="M -40 20 C -70 -20 -40 -70 -25 -80 C -10 -70 -25 -20 0 20 Z" fill="url(#swanGrad)" stroke="#B0BEC5" stroke-width="4"/>
      <!-- Swan Head -->
      <circle cx="-25" cy="-85" r="20" fill="url(#swanGrad)" stroke="#B0BEC5" stroke-width="4"/>
      <!-- Beak -->
      <path d="M -38 -85 L -60 -80 L -38 -73 Z" fill="#FF9800"/>
      <!-- Eye -->
      <circle cx="-30" cy="-90" r="4" fill="#212121"/>
      <circle cx="-31" cy="-91" r="1.5" fill="#FFF"/>
    </g>

    <!-- Saraswati sitting gracefully -->
    <g transform="translate(260, 190)">
      <!-- Veena -->
      <g transform="translate(0, 40) rotate(-20)">
        <line x1="-100" y1="0" x2="100" y2="0" stroke="#8D6E63" stroke-width="10"/>
        <circle cx="-80" cy="12" r="22" fill="#D7CCC8" stroke="#5D4037" stroke-width="3"/>
      </g>

      <!-- Body -->
      <ellipse cx="0" cy="70" rx="68" ry="55" fill="url(#ssSkin)" stroke="#F06292" stroke-width="4"/>
      <path d="M -60 45 Q 0 120 60 45 Z" fill="#FFFFFF" stroke="#F48FB1" stroke-width="4"/>

      <!-- Head -->
      <circle cx="0" cy="-25" r="68" fill="url(#ssSkin)" stroke="#F06292" stroke-width="5"/>

      <!-- Crown -->
      <path d="M -60 -80 L 60 -80 L 45 -155 L 0 -180 L -45 -155 Z" fill="#FFE082" stroke="#FFB300" stroke-width="5"/>
      <circle cx="0" cy="-130" r="14" fill="#EC407A"/>

      <!-- Eyes -->
      <ellipse cx="-28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="-31" cy="-42" r="4" fill="#FFF"/>
      <ellipse cx="28" cy="-38" rx="11" ry="13" fill="#212121"/>
      <circle cx="25" cy="-42" r="4" fill="#FFF"/>

      <!-- Smile & Cheeks -->
      <path d="M -18 -8 Q 0 12 18 -8" fill="none" stroke="#C2185B" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="-40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
      <circle cx="40" cy="-18" r="12" fill="#FF8A80" opacity="0.6"/>
    </g>
  </g>
</svg>
