<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <filter id="swSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#455A64" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#swSh)" transform="translate(250, 250)">
    <!-- Water ripples base -->
    <ellipse cx="0" cy="110" rx="160" ry="30" fill="#80DEEA" opacity="0.6"/>

    <!-- Swan Body -->
    <ellipse cx="20" cy="35" rx="110" ry="65" fill="url(#swGrad)" stroke="#90A4AE" stroke-width="6"/>

    <!-- Wing Flap Contour -->
    <path d="M 40 10 Q 90 -20 110 30 Q 50 60 40 10 Z" fill="#ECEFF1" stroke="#90A4AE" stroke-width="4"/>

    <!-- Graceful S-Curved Neck -->
    <path d="M -50 35 C -100 -20 -50 -90 -25 -105 C -5 -90 -35 -20 0 35 Z" fill="url(#swGrad)" stroke="#90A4AE" stroke-width="6"/>

    <!-- Swan Head -->
    <circle cx="-25" cy="-110" r="28" fill="url(#swGrad)" stroke="#90A4AE" stroke-width="6"/>

    <!-- Beak -->
    <path d="M -45 -110 L -75 -102 L -45 -94 Z" fill="#FF9800" stroke="#F57C00" stroke-width="3"/>

    <!-- Eye -->
    <circle cx="-32" cy="-116" r="6" fill="#212121"/>
    <circle cx="-34" cy="-118" r="2" fill="#FFF"/>

    <!-- Cheek Blush -->
    <circle cx="-20" cy="-105" r="8" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
