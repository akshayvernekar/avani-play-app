<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#651FFF"/>
    </linearGradient>
    <filter id="pSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#01579B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#pSh)" transform="translate(250, 250)">
    <!-- Fan of Tail Feathers -->
    <path d="M 0 50 Q -170 -80 -110 -150 C -70 -170 0 10 0 50 Z" fill="url(#pCardGrad)"/>
    <path d="M 0 50 Q -110 -140 -35 -180 C 0 -180 0 10 0 50 Z" fill="url(#pCardGrad)"/>
    <path d="M 0 50 Q 0 -190 35 -180 C 110 -140 0 10 0 50 Z" fill="url(#pCardGrad)"/>
    <path d="M 0 50 Q 170 -80 110 -150 C 70 -170 0 10 0 50 Z" fill="url(#pCardGrad)"/>

    <!-- Peacock Feather Eye Circles -->
    <circle cx="-115" cy="-125" r="14" fill="#FFD54F"/>
    <circle cx="-115" cy="-125" r="7" fill="#00B0FF"/>
    <circle cx="-40" cy="-150" r="14" fill="#FFD54F"/>
    <circle cx="-40" cy="-150" r="7" fill="#00B0FF"/>
    <circle cx="40" cy="-150" r="14" fill="#FFD54F"/>
    <circle cx="40" cy="-150" r="7" fill="#00B0FF"/>
    <circle cx="115" cy="-125" r="14" fill="#FFD54F"/>
    <circle cx="115" cy="-125" r="7" fill="#00B0FF"/>

    <!-- Peacock Body -->
    <ellipse cx="0" cy="50" rx="55" ry="45" fill="#0288D1" stroke="#01579B" stroke-width="5"/>

    <!-- Neck & Head -->
    <path d="M -18 20 C -25 -20 -15 -60 0 -70 C 15 -60 25 -20 18 20 Z" fill="#0288D1" stroke="#01579B" stroke-width="5"/>
    <circle cx="0" cy="-75" r="24" fill="#0288D1" stroke="#01579B" stroke-width="5"/>

    <!-- Beak -->
    <path d="M -8 -75 L -25 -70 L -8 -65 Z" fill="#FFD54F"/>

    <!-- Eyes -->
    <circle cx="4" cy="-80" r="5" fill="#212121"/>
    <circle cx="3" cy="-81" r="1.8" fill="#FFF"/>

    <!-- Head Crown Feather Pins -->
    <line x1="0" y1="-95" x2="-10" y2="-115" stroke="#FFD54F" stroke-width="2.5"/>
    <circle cx="-10" cy="-115" r="4" fill="#00E676"/>
    <line x1="0" y1="-95" x2="0" y2="-118" stroke="#FFD54F" stroke-width="2.5"/>
    <circle cx="0" cy="-118" r="4" fill="#00E676"/>
    <line x1="0" y1="-95" x2="10" y2="-115" stroke="#FFD54F" stroke-width="2.5"/>
    <circle cx="10" cy="-115" r="4" fill="#00E676"/>
  </g>
</svg>
