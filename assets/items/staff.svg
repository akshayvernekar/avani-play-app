<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="staffWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BCAAA4"/>
      <stop offset="50%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <filter id="staffShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4E342E" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#EDE7F6" opacity="0.9"/>
  <g filter="url(#staffShadow)" transform="translate(200, 200) rotate(15)">
    <!-- Main Sturdy Shaft -->
    <rect x="-10" y="-120" width="20" height="250" rx="10" fill="url(#staffWood)" stroke="#3E2723" stroke-width="4"/>
    <!-- Gold Ring Bands -->
    <rect x="-12" y="-50" width="24" height="12" rx="3" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <rect x="-12" y="20" width="24" height="12" rx="3" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <rect x="-12" y="80" width="24" height="12" rx="3" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <!-- Sacred Staff Finial / Sun Disc Head -->
    <g transform="translate(0, -125)">
      <!-- Golden Crown Knob -->
      <circle cx="0" cy="0" r="28" fill="#FFD54F" stroke="#E65100" stroke-width="4"/>
      <!-- Inner gemstone -->
      <circle cx="0" cy="0" r="14" fill="#00BCD4" stroke="#00838F" stroke-width="3"/>
      <!-- Decorative wing finials -->
      <path d="M -25 5 C -45 -10 -40 -35 -20 -28 Z" fill="#FFA000" stroke="#E65100" stroke-width="3"/>
      <path d="M 25 5 C 45 -10 40 -35 20 -28 Z" fill="#FFA000" stroke="#E65100" stroke-width="3"/>
    </g>
    <!-- Base ferrule -->
    <rect x="-11" y="120" width="22" height="15" rx="5" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
  </g>
</svg>