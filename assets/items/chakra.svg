<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chakraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="85%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </radialGradient>
    <filter id="chakraShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#FF8F00" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#E1F5FE" opacity="0.9"/>
  <g filter="url(#chakraShadow)" transform="translate(200, 200)">
    <!-- Outer Radiant Fire Sparks / Serrated Blades (12 rays) -->
    <!-- Center Disk -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="#FFA000" stroke-width="8"/>
    <!-- 12 Serrated Blades -->
    <g id="blades">
      <path d="M 0 -135 L 18 -105 L -10 -115 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 68 -117 L 72 -83 L 53 -100 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 117 -68 L 105 -38 L 100 -59 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 135 0 L 105 18 L 115 -10 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 117 68 L 83 72 L 100 53 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 68 117 L 38 105 L 59 100 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M 0 135 L -18 105 L 10 115 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M -68 117 L -72 83 L -53 100 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M -117 68 L -105 38 L -100 59 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M -135 0 L -105 -18 L -115 10 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M -117 -68 L -83 -72 L -100 -53 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
      <path d="M -68 -117 L -38 -105 L -59 -100 Z" fill="#FF8F00" stroke="#E65100" stroke-width="3"/>
    </g>
    <!-- Golden Rim -->
    <circle cx="0" cy="0" r="105" fill="url(#chakraGlow)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="0" r="85" fill="#FFFDE7" stroke="#FFB300" stroke-width="4"/>
    <!-- 8 Inner Spokes -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#FFA000" stroke-width="6"/>
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#FFA000" stroke-width="6"/>
    <line x1="-60" y1="-60" x2="60" y2="60" stroke="#FFA000" stroke-width="6"/>
    <line x1="60" y1="-60" x2="-60" y2="60" stroke="#FFA000" stroke-width="6"/>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="32" fill="#FF8F00" stroke="#B71C1C" stroke-width="4"/>
    <circle cx="0" cy="0" r="16" fill="#FFF" stroke="#FF8F00" stroke-width="3"/>
  </g>
</svg>