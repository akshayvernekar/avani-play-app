<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="velGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="velShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#EDE7F6" opacity="0.9"/>
  <g filter="url(#velShadow)" transform="translate(200, 200)">
    <!-- Long Shaft -->
    <rect x="-7" y="-50" width="14" height="210" rx="7" fill="#8D6E63" stroke="#4E342E" stroke-width="4"/>
    <rect x="-9" y="30" width="18" height="12" rx="4" fill="url(#velGold)" stroke="#E65100" stroke-width="2"/>
    <rect x="-9" y="90" width="18" height="12" rx="4" fill="url(#velGold)" stroke="#E65100" stroke-width="2"/>
    <!-- Classic Leaf-shaped Divine Vel Head -->
    <g transform="translate(0, -60)">
      <!-- Leaf blade contour -->
      <path d="M 0 -105 Q 45 -40 38 10 Q 30 35 0 35 Q -30 35 -38 10 Q -45 -40 0 -105 Z" fill="url(#velGold)" stroke="#E65100" stroke-width="5"/>
      <!-- Vel Center Spine -->
      <line x1="0" y1="-95" x2="0" y2="35" stroke="#E65100" stroke-width="5" stroke-linecap="round"/>
      <!-- Sacred Vibhuti / Tilak Lines on Vel -->
      <line x1="-16" y1="-20" x2="16" y2="-20" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="-14" y1="-12" x2="14" y2="-12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-12" r="4" fill="#D50000"/>
      <!-- Decorative base rings -->
      <ellipse cx="0" cy="35" rx="16" ry="7" fill="#FFA000" stroke="#E65100" stroke-width="3"/>
    </g>
  </g>
</svg>