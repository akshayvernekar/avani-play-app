<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="kamGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <filter id="kamShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#E65100" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#FFF3E0" opacity="0.9"/>
  <g filter="url(#kamShadow)" transform="translate(200, 205)">
    <!-- Base foot of pot -->
    <ellipse cx="0" cy="85" rx="42" ry="12" fill="#E65100" stroke="#BF360C" stroke-width="4"/>
    <!-- Pot Pear-shaped Body -->
    <path d="M -28 -20 C -70 15 -75 75 -25 85 L 25 85 C 75 75 70 15 28 -20 Z" fill="url(#kamGlow)" stroke="#BF360C" stroke-width="5"/>
    <!-- Pot Neck & Lip -->
    <rect x="-24" y="-40" width="48" height="22" rx="6" fill="#FFA726" stroke="#BF360C" stroke-width="4"/>
    <ellipse cx="0" cy="-40" rx="26" ry="10" fill="#FFE082" stroke="#BF360C" stroke-width="4"/>
    <!-- Spout on Side -->
    <path d="M 45 35 Q 75 30 70 10 Q 55 18 40 25 Z" fill="#FFA726" stroke="#BF360C" stroke-width="4"/>
    <!-- Curved Overhead Handle -->
    <path d="M -30 -30 C -35 -110 35 -110 30 -30" fill="none" stroke="#E65100" stroke-width="10" stroke-linecap="round"/>
    <path d="M -30 -30 C -35 -110 35 -110 30 -30" fill="none" stroke="#FFD54F" stroke-width="4" stroke-linecap="round"/>
    <!-- Sacred Water droplet reflection -->
    <ellipse cx="-20" cy="35" rx="8" ry="18" fill="#FFF9C4" opacity="0.7"/>
  </g>
</svg>