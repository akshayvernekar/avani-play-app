<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </radialGradient>
    <filter id="mShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#FF6F00" flood-opacity="0.2"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="160" fill="#FFF8E1" opacity="0.9"/>
  <g filter="url(#mShadow)" transform="translate(200, 205)">
    <!-- Base plate leaf / plate -->
    <ellipse cx="0" cy="110" rx="120" ry="25" fill="#81C784" stroke="#388E3C" stroke-width="4"/>
    <!-- Modak Body -->
    <path d="M 0 -130 Q 30 -60 95 30 Q 115 85 60 110 Q 0 120 -60 110 Q -115 85 -95 30 Q -30 -60 0 -130 Z" fill="url(#mGlow)" stroke="#E65100" stroke-width="6"/>
    <!-- Modak Pleats / Folds -->
    <path d="M 0 -120 Q 0 20 0 115" stroke="#FF8F00" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0 -120 Q 35 10 50 105" stroke="#FF8F00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 -120 Q -35 10 -50 105" stroke="#FF8F00" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 -120 Q 60 20 85 70" stroke="#FF8F00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 -120 Q -60 20 -85 70" stroke="#FF8F00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Saffron / Kesar mark on top -->
    <ellipse cx="0" cy="-60" rx="6" ry="12" fill="#D84315"/>
    <circle cx="0" cy="-125" rx="5" ry="5" fill="#D84315"/>
  </g>
</svg>