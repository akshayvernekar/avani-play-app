<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5CAE9"/>
      <stop offset="100%" stop-color="#7986CB"/>
    </linearGradient>
    <linearGradient id="shCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="shRobes" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <filter id="shShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1A237E" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E8EAF6" opacity="0.85"/>

  <g filter="url(#shShadow)" transform="translate(250, 250)">
    <!-- Blue Robes Body -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#shSkin)" stroke="#283593" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#shRobes)" stroke="#1A237E" stroke-width="4"/>

    <!-- Golden Bow (Dhanush) in Left Hand -->
    <g transform="translate(-105, 30)">
      <path d="M 0 -50 Q 30 0 0 50" fill="none" stroke="#FFB300" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="-50" x2="0" y2="50" stroke="#FFE082" stroke-width="2"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#shSkin)" stroke="#283593" stroke-width="6"/>

    <!-- Calm Just Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Tilak -->
    <path d="M -12 -80 L 12 -80 L 0 -102 Z" fill="#303F9F"/>
    <circle cx="0" cy="-86" r="4" fill="#FFD54F"/>

    <!-- Crown with Deep Sapphire -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#shCrown)" stroke="#FF8F00" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#1A237E"/>
    <circle cx="0" cy="-155" r="8" fill="#8C9EFF"/>

    <!-- Cheeks & Gentle Wise Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#9FA8DA" opacity="0.5"/>
    <circle cx="50" cy="-20" r="14" fill="#9FA8DA" opacity="0.5"/>
    <path d="M -20 -10 Q 0 12 20 -10" fill="none" stroke="#1A237E" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>