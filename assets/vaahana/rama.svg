<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2DFDB"/>
      <stop offset="100%" stop-color="#4DB6AC"/>
    </linearGradient>
    <linearGradient id="rCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="rDhoti" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <filter id="rShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#00695C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <circle cx="250" cy="230" r="180" fill="#E0F2F1" opacity="0.85"/>

  <g filter="url(#rShadow)" transform="translate(250, 250)">
    <!-- Quiver with Arrows on Back -->
    <g transform="translate(85, -20) rotate(15)">
      <rect x="-10" y="-50" width="20" height="90" rx="6" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
      <!-- Arrow fletchings -->
      <polygon points="-8,-60 0,-75 8,-60" fill="#E53935"/>
      <polygon points="-3,-65 5,-80 13,-65" fill="#FFEB3B"/>
    </g>

    <!-- Royal Body & Dhoti -->
    <ellipse cx="0" cy="90" rx="80" ry="75" fill="url(#rSkin)" stroke="#00796B" stroke-width="5"/>
    <path d="M -75 60 Q 0 160 75 60 Q 0 120 -75 60 Z" fill="url(#rDhoti)" stroke="#F57F17" stroke-width="4"/>

    <!-- Mighty Bow (Kodanda) in Left Hand -->
    <g transform="translate(-115, 20)">
      <path d="M 0 -80 Q 40 0 0 80" fill="none" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="-80" x2="0" y2="80" stroke="#FFE082" stroke-width="2.5"/>
    </g>

    <!-- Head -->
    <circle cx="0" cy="-30" r="80" fill="url(#rSkin)" stroke="#00796B" stroke-width="6"/>

    <!-- Noble Gentle Eyes -->
    <ellipse cx="-35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="-40" cy="-50" r="5" fill="#FFF"/>
    <ellipse cx="35" cy="-45" rx="14" ry="16" fill="#212121"/>
    <circle cx="30" cy="-50" r="5" fill="#FFF"/>

    <!-- Royal Tilak -->
    <path d="M -12 -75 Q -12 -92 0 -92 Q 12 -92 12 -75" fill="none" stroke="#E53935" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-80" r="4" fill="#FFEB3B"/>

    <!-- Royal Maryada Purushottam Crown -->
    <path d="M -75 -95 L 75 -95 L 55 -190 L 0 -220 L -55 -190 Z" fill="url(#rCrown)" stroke="#E65100" stroke-width="5"/>
    <circle cx="0" cy="-155" r="18" fill="#00897B"/>
    <circle cx="0" cy="-155" r="8" fill="#FFF"/>

    <!-- Cheeks & Gentle King Smile -->
    <circle cx="-50" cy="-20" r="14" fill="#80CBC4" opacity="0.6"/>
    <circle cx="50" cy="-20" r="14" fill="#80CBC4" opacity="0.6"/>
    <path d="M -22 -10 Q 0 15 22 -10" fill="none" stroke="#004D40" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>