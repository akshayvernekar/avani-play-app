<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAB91"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
    <linearGradient id="gCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="dhoti" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <filter id="gShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4E342E" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Aura Glow Behind -->
  <circle cx="250" cy="230" r="180" fill="#FFF9C4" opacity="0.6"/>

  <g filter="url(#gShadow)" transform="translate(250, 250)">
    <!-- Body & Dhoti -->
    <ellipse cx="0" cy="90" rx="90" ry="75" fill="url(#gBody)" stroke="#E64A19" stroke-width="6"/>
    <path d="M -80 70 Q 0 160 80 70 Q 0 130 -80 70 Z" fill="url(#dhoti)" stroke="#F57F17" stroke-width="4"/>

    <!-- Left Arm holding Modak -->
    <path d="M -70 50 Q -110 70 -90 100 Q -60 100 -50 75 Z" fill="url(#gBody)" stroke="#E64A19" stroke-width="5"/>
    <ellipse cx="-100" cy="85" rx="14" ry="16" fill="#FFB300" stroke="#E65100" stroke-width="3"/>

    <!-- Right Arm Blessing -->
    <path d="M 70 50 Q 110 60 100 90 Q 70 90 50 75 Z" fill="url(#gBody)" stroke="#E64A19" stroke-width="5"/>
    <circle cx="95" cy="70" r="14" fill="#FF8A65"/>
    <!-- Abhaya Mudra mark -->
    <circle cx="95" cy="70" r="5" fill="#E53935"/>

    <!-- Ears -->
    <ellipse cx="-100" cy="-40" rx="60" ry="45" fill="#FFAB91" stroke="#E64A19" stroke-width="5"/>
    <ellipse cx="-100" cy="-40" rx="35" ry="25" fill="#FF8A65"/>
    <ellipse cx="100" cy="-40" rx="60" ry="45" fill="#FFAB91" stroke="#E64A19" stroke-width="5"/>
    <ellipse cx="100" cy="-40" rx="35" ry="25" fill="#FF8A65"/>

    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="90" ry="80" fill="url(#gBody)" stroke="#E64A19" stroke-width="6"/>

    <!-- Eyes -->
    <ellipse cx="-40" cy="-50" rx="14" ry="16" fill="#212121"/>
    <circle cx="-45" cy="-55" r="5" fill="#FFF"/>
    <ellipse cx="40" cy="-50" rx="14" ry="16" fill="#212121"/>
    <circle cx="35" cy="-55" r="5" fill="#FFF"/>

    <!-- Tilak -->
    <path d="M -18 -95 L 18 -95 L 22 -110 L 0 -125 L -22 -110 Z" fill="#E53935"/>
    <circle cx="0" cy="-102" r="6" fill="#FFEB3B"/>

    <!-- Trunk curving right -->
    <path d="M -20 -10 C -30 50 40 60 50 30 C 55 15 35 10 25 25" fill="none" stroke="#E64A19" stroke-width="24" stroke-linecap="round"/>
    <path d="M -20 -10 C -30 50 40 60 50 30 C 55 15 35 10 25 25" fill="none" stroke="#FFAB91" stroke-width="14" stroke-linecap="round"/>

    <!-- Tusk -->
    <path d="M -22 10 L -38 18 L -20 22 Z" fill="#FFF" stroke="#E64A19" stroke-width="2"/>

    <!-- Crown (Mukut) -->
    <path d="M -70 -100 L 70 -100 L 50 -180 L 0 -210 L -50 -180 Z" fill="url(#gCrown)" stroke="#F57F17" stroke-width="6"/>
    <circle cx="0" cy="-150" r="16" fill="#E91E63"/>
    <circle cx="0" cy="-150" r="7" fill="#FFF"/>

    <!-- Rosy Cheeks -->
    <circle cx="-60" cy="-20" r="16" fill="#FF8A80" opacity="0.6"/>
    <circle cx="60" cy="-20" r="16" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>
